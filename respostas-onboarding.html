<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboardings — painel | Prado &amp; Co</title>
<style>
  :root{
    --tinta:#12211f; --papel:#FBFAF7; --verde:#0F766E; --verde-fundo:#0c5f59;
    --verde-claro:#E3F0EE; --verde-borda:#B9D8D3; --traco:#DCD9D2; --apagado:#6B7773;
    --destaque:#FDF6E3; --destaque-borda:#EBD9A8; --erro:#B91C1C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);
    font-family:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:0 20px 80px}
  header{padding:34px 0 6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header img{height:32px;width:auto;display:block}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:26px;margin:0;font-weight:600;letter-spacing:-.015em}
  .sub{flex-basis:100%;margin:2px 0 0;color:var(--apagado);font-size:14px}

  /* login */
  .login{max-width:380px;margin:60px auto;background:#fff;border:1px solid var(--traco);border-radius:10px;padding:26px 24px}
  .login h2{font-family:Georgia,serif;font-size:20px;margin:0 0 4px;font-weight:600}
  .login p{margin:0 0 18px;font-size:13.5px;color:var(--apagado)}
  .login input{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:1px solid var(--traco);border-radius:8px;margin:0 0 12px}
  .login input:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-claro)}
  .login button{width:100%}
  .login .erro-login{display:none;color:var(--erro);font-size:13.5px;margin:2px 0 10px}

  /* barra de ferramentas */
  .ferramentas{display:flex;gap:10px;align-items:center;margin:18px 0 16px;flex-wrap:wrap}
  .ferramentas input{flex:1;min-width:200px;font:inherit;font-size:15px;padding:10px 13px;border:1px solid var(--traco);border-radius:8px;background:#fff}
  .ferramentas input:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-claro)}
  .contagem{font-size:13.5px;color:var(--apagado);white-space:nowrap}

  /* cartões */
  .cartao{background:#fff;border:1px solid var(--traco);border-radius:10px;margin:0 0 12px;overflow:hidden}
  .cartao > .cabeca{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;flex-wrap:wrap}
  .cartao > .cabeca:hover{background:#FDFDFB}
  .cartao .nome{font-weight:700;font-size:16.5px}
  .cartao .meta{font-size:13.5px;color:var(--apagado)}
  .cartao .quando{margin-left:auto;font-size:12.5px;color:var(--apagado);white-space:nowrap}
  .cartao .seta{color:var(--apagado);transition:transform .2s;font-size:13px}
  .cartao.aberto .seta{transform:rotate(90deg)}
  .cartao .corpo{display:none;border-top:1px solid var(--traco);padding:18px}
  .cartao.aberto .corpo{display:block}

  .grupo{margin:0 0 18px}
  .grupo:last-child{margin-bottom:0}
  .grupo h3{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--verde);margin:0 0 8px}
  .linha{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed #ECEAE4;font-size:14.5px}
  .linha:last-child{border-bottom:0}
  .linha b{flex:none;width:190px;font-weight:600;color:var(--apagado)}
  .linha span{flex:1;min-width:0;word-wrap:break-word}
  @media (max-width:560px){.linha{flex-direction:column;gap:1px}.linha b{width:auto}}

  .botoes{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 0;padding-top:16px;border-top:1px solid var(--traco)}
  button{font:inherit;font-size:14px;font-weight:650;padding:10px 16px;border-radius:8px;cursor:pointer;
    border:1px solid var(--verde);background:var(--verde);color:#fff;transition:background .15s}
  button:hover{background:var(--verde-fundo)}
  button.claro{background:var(--verde-claro);color:var(--verde);border-color:var(--verde-borda)}
  button.claro:hover{background:#d5e8e4}
  button.neutro{background:transparent;color:var(--apagado);border-color:var(--traco)}
  button.neutro:hover{color:var(--tinta);border-color:#BFC7C4}

  .vazio{text-align:center;color:var(--apagado);padding:60px 20px;font-size:15px}
  .aviso-topo{display:none;margin:14px 0;padding:12px 15px;background:var(--destaque);
    border:1px solid var(--destaque-borda);border-left:4px solid #B8860B;border-radius:6px;font-size:14px}
</style>
</head>

    <h1>Onboardings</h1>
    <p class="sub">Respostas do formulário de boas-vindas — pradoco.vercel.app/formulario.html</p>
  </header>

  <!-- LOGIN -->
  <div class="login" id="telaLogin">
    <h2>Entrar no painel</h2>
    <p>Mesma senha do painel de planejamento.</p>
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password">
    <p class="erro-login" id="erroLogin">Senha incorreta. Tenta de novo.</p>
    <button onclick="entrar()">Entrar</button>
  </div>

  <!-- PAINEL -->
  <div id="painel" style="display:none">
    <div class="aviso-topo" id="avisoTopo"></div>
    <div class="ferramentas">
      <input type="search" id="busca" placeholder="Buscar farmácia, cidade ou responsável...">
      <span class="contagem" id="contagem"></span>
      <button class="neutro" onclick="carregar()">Atualizar</button>
    </div>
    <div id="lista"></div>
  </div>

</div>

<script>
(function(){
  const SUPA_URL = "https://avitrcjknuphgdgzlmen.supabase.co";
  const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2aXRyY2prbnVwaGdkZ3psbWVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NjI4MjEsImV4cCI6MjA5ODAzODgyMX0.R7GLAiNMXv76mpti8_Ftwr6DqL3JbLUiwC74PmPFNBw";
  const EMAIL_PAINEL = "painel@pradoco.com.br";   /* mesmo usuário do painel de planejamento */
  const TABELA = "onboarding_farmacia";

  const $ = id => document.getElementById(id);
  let token = sessionStorage.getItem('tokenPainel') || '';
  let dados = [];

  function esc(t){
    return String(t == null ? '' : t)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function ou(v, alt){ return (v && String(v).trim()) ? String(v).trim() : (alt || '—'); }

  /* ---------- login (Supabase Auth, e-mail fixo) ---------- */
  window.entrar = function(){
    const senha = $('senha').value;
    $('erroLogin').style.display = 'none';
    fetch(SUPA_URL + '/auth/v1/token?grant_type=password', {
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPA_KEY},
      body: JSON.stringify({email: EMAIL_PAINEL, password: senha})
    }).then(r => r.json()).then(j => {
      if (!j.access_token) throw new Error('senha');
      token = j.access_token;
      sessionStorage.setItem('tokenPainel', token);
      $('telaLogin').style.display = 'none';
      $('painel').style.display = 'block';
      carregar();
    }).catch(_ => { $('erroLogin').style.display = 'block'; });
  };
  $('senha').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

  /* ---------- carregar respostas ---------- */
  window.carregar = function(){
    $('avisoTopo').style.display = 'none';
    fetch(SUPA_URL + '/rest/v1/' + TABELA + '?select=*&order=criado_em.desc', {
      headers:{'apikey':SUPA_KEY, 'Authorization':'Bearer ' + token}
    }).then(r => {
      if (r.status === 401){ sair(); throw new Error('expirou'); }
      return r.json();
    }).then(j => {
      dados = Array.isArray(j) ? j : [];
      render();
    }).catch(e => {
      if (e.message !== 'expirou'){
        $('avisoTopo').style.display = 'block';
        $('avisoTopo').textContent = 'Não consegui carregar as respostas agora. Confere a internet e clica em Atualizar.';
      }
    });
  };
  function sair(){
    token=''; sessionStorage.removeItem('tokenPainel');
    $('painel').style.display='none'; $('telaLogin').style.display='block';
  }

  /* ---------- montar textos prontos ---------- */
  function resumoFrete(r){
    if (r.faz_entrega !== 'Sim') return 'Não faz entrega';
    let f = ou(r.tipo_frete, 'frete não informado');
    if (r.tipo_frete === 'Grátis acima de um valor' && r.entrega_gratis_acima)
      f = 'Grátis acima de ' + r.entrega_gratis_acima + (r.taxa_entrega ? ' (abaixo disso: ' + r.taxa_entrega + ')' : '');
    if (r.tipo_frete === 'Sempre tem taxa' && r.taxa_entrega)
      f = 'Taxa de ' + r.taxa_entrega;
    return f;
  }

  function briefingRoteiro(r){
    const L = [];
    L.push('BRIEFING — ROTEIRO INSTITUCIONAL');
    L.push('Farmácia: ' + ou(r.farmacia));
    L.push('Cidade: ' + ou(r.cidade));
    L.push('Tempo de loja: ' + ou(r.anos_loja));
    L.push('Endereço: ' + ou(r.endereco));
    L.push('WhatsApp: ' + ou(r.whatsapp_atendimento));
    L.push('Instagram: ' + ou(r.instagram));
    L.push('');
    L.push('Melhor preço em: ' + ou(r.melhor_preco));
    if (r.vende_bem) L.push('Vende bem: ' + r.vende_bem);
    if (r.servicos) L.push('Serviços grátis na loja: ' + r.servicos);
    if (r.diferencial) L.push('Diferencial: ' + r.diferencial);
    L.push('Entrega: ' + resumoFrete(r) + (r.faz_entrega === 'Sim' && r.raio_entrega ? ' · área: ' + r.raio_entrega : ''));
    L.push('Parcelamento: ' + ou(r.parcelamento));
    if (r.observacoes) L.push('Observações do cliente: ' + r.observacoes);
    L.push('');
    L.push('REGRAS: gancho no padrão "Você de ' + ou(r.cidade,'[cidade]').split('/')[0].trim() + ' sabia que a ' + ou(r.farmacia,'[marca]') + '..." — nunca abrir com produto ou preço. Estrutura de 4 cenas. Não prometer nada que não está listado acima. Traduzir jargão pra linguagem do cliente.');
    return L.join('\n');
  }

  function repasseDesigners(r){
    const L = [];
    L.push('ARTE DE ENTREGA — ' + ou(r.farmacia));
    L.push('');
    L.push('Entrega: ' + ou(r.faz_entrega));
    if (r.faz_entrega === 'Sim'){
      L.push('Condição: ' + resumoFrete(r));
      L.push('Área de entrega: ' + ou(r.raio_entrega));
      if (r.motoboy) L.push('Quem entrega: ' + r.motoboy);
    }
    L.push('Parcelamento: ' + ou(r.parcelamento) + (r.parcelamento && r.parcelamento !== 'Não parcelamos' ? ' sem juros' : ''));
    L.push('');
    L.push('WhatsApp (pra arte): ' + ou(r.whatsapp_atendimento));
    L.push('Endereço (pra arte): ' + ou(r.endereco));
    L.push('Instagram: ' + ou(r.instagram));
    return L.join('\n');
  }

  window.copiar = function(idx, tipo, btn){
    const r = dados[idx];
    const texto = tipo === 'roteiro' ? briefingRoteiro(r) : repasseDesigners(r);
    const ok = () => {
      const antes = btn.textContent;
      btn.textContent = 'Copiado ✓';
      setTimeout(() => btn.textContent = antes, 2000);
    };
    if (navigator.clipboard){ navigator.clipboard.writeText(texto).then(ok).catch(()=>fallback(texto, ok)); }
    else fallback(texto, ok);
  };
  function fallback(texto, pronto){
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); pronto(); }catch(e){}
    document.body.removeChild(ta);
  }

  /* ---------- render ---------- */
  function dataBr(iso){
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit'}) + ' ' +
           d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  }

  function linha(rotulo, valor){
    if (!valor || !String(valor).trim()) return '';
    return '<div class="linha"><b>' + esc(rotulo) + '</b><span>' + esc(valor) + '</span></div>';
  }

  window.render = function(){
    const q = ($('busca').value || '').toLowerCase();
    const vis = dados.map((r,i)=>({r,i})).filter(({r}) =>
      !q || [r.farmacia, r.cidade, r.responsavel].some(v => v && v.toLowerCase().includes(q)));

    $('contagem').textContent = vis.length + (vis.length === 1 ? ' resposta' : ' respostas');

    if (!vis.length){
      $('lista').innerHTML = '<p class="vazio">' + (dados.length ?
        'Nenhuma resposta bate com a busca.' :
        'Nenhum onboarding recebido ainda. Quando a primeira farmácia preencher o formulário, ela aparece aqui.') + '</p>';
      return;
    }

    $('lista').innerHTML = vis.map(({r,i}) =>
      '<div class="cartao" id="c'+i+'">' +
        '<div class="cabeca" onclick="document.getElementById(\'c'+i+'\').classList.toggle(\'aberto\')">' +
          '<span class="seta">▶</span>' +
          '<div><div class="nome">' + esc(ou(r.farmacia,'(sem nome)')) + '</div>' +
          '<div class="meta">' + esc(ou(r.cidade,'')) + (r.responsavel ? ' · ' + esc(r.responsavel) : '') + '</div></div>' +
          '<span class="quando">' + dataBr(r.criado_em) + '</span>' +
        '</div>' +
        '<div class="corpo">' +
          '<div class="grupo"><h3>A loja</h3>' +
            linha('Responsável', r.responsavel) +
            linha('Cidade', r.cidade) +
            linha('Endereço', r.endereco) +
            linha('Tempo de loja', r.anos_loja) +
            linha('WhatsApp de atendimento', r.whatsapp_atendimento) +
            linha('Instagram', r.instagram) +
          '</div>' +
          '<div class="grupo"><h3>Entrega</h3>' +
            linha('Faz entrega', r.faz_entrega) +
            linha('Frete', r.faz_entrega === 'Sim' ? resumoFrete(r) : '') +
            linha('Área', r.raio_entrega) +
            linha('Quem entrega', r.motoboy) +
          '</div>' +
          '<div class="grupo"><h3>Pagamento</h3>' +
            linha('Parcelamento sem juros', r.parcelamento) +
          '</div>' +
          '<div class="grupo"><h3>Produtos e serviços</h3>' +
            linha('Melhor preço', r.melhor_preco) +
            linha('Vende bem', r.vende_bem) +
            linha('Serviços grátis', r.servicos) +
            linha('Diferencial', r.diferencial) +
          '</div>' +
          '<div class="grupo"><h3>Tráfego</h3>' +
            linha('Página no Facebook', r.tem_pagina) +
            linha('Link da página', r.link_pagina) +
            linha('Conta de anúncios', r.tem_conta_ads) +
            linha('Pagamento do tráfego', r.forma_trafego) +
            linha('CPF/CNPJ (Pix)', r.cpf_cnpj_titular) +
          '</div>' +
          (r.observacoes ? '<div class="grupo"><h3>Observações</h3>' + linha('Do cliente', r.observacoes) + '</div>' : '') +
          '<div class="botoes">' +
            '<button onclick="copiar('+i+', \'roteiro\', this)">Copiar briefing do roteiro</button>' +
            '<button class="claro" onclick="copiar('+i+', \'designers\', this)">Copiar arte de entrega (designers)</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    ).join('');
  };

  $('busca').addEventListener('input', render);

  /* sessão anterior ainda válida? */
  if (token){
    $('telaLogin').style.display='none';
    $('painel').style.display='block';
    carregar();
  }
})();
</script>
</body>
</html>
